<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="SmokySignal mark">
    <!-- ORBIT BLIP above the peak (CB whip + circling aircraft) -->
    <circle cx="32" cy="9" r="2.6" fill="#B7791F"/>
    <!-- SIGNAL ARC: short curve under the blip, anchoring it to the crown -->
    <path d="M 26.5 13 Q 32 16 37.5 13"
          fill="none" stroke="#B7791F" stroke-width="1.8"
          stroke-linecap="round" opacity="0.7"/>

    <!-- CROWN: pinched campaign hat, drawn as one solid silhouette. -->
    <path d="M 19 44
             L 19 28
             Q 19 19.5 24 18
             Q 28.5 17 30 19.5
             Q 32 17 34 19.5
             Q 35.5 17 40 18
             Q 45 19.5 45 28
             L 45 44 Z"
          fill="#B7791F"/>

    <!-- CROWN DENT: subtle pinch detail across the top (large sizes only) -->
    <path d="M 24 22 Q 32 25 40 22"
          fill="none" stroke="#0B0D10" stroke-width="1.4"
          stroke-linecap="round" opacity="0.32"/>

    <!-- HAT BAND: dark stripe across the base of the crown -->
    <rect x="19" y="38" width="26" height="3.6" fill="#0B0D10" opacity="0.92"/>
    <!-- Band buckle dot -->
    <circle cx="41" cy="39.8" r="1" fill="#B7791F" opacity="0.95"/>

    <!-- BRIM: wide flat campaign-hat brim, gentle gull-wing curve -->
    <path d="M 3 46
             Q 17 42 32 43
             Q 47 42 61 46
             L 61 50
             Q 47 47 32 48
             Q 17 47 3 50 Z"
          fill="#B7791F"/>
  </svg>
