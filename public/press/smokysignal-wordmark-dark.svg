<svg role="img" aria-label="SmokySignal" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 64" width="360" height="64">
    
    <!-- ORBIT BLIP above the peak (CB whip + circling aircraft) -->
    <circle cx="32" cy="9" r="2.6" fill="#f5b840"/>
    <!-- SIGNAL ARC: short curve under the blip, anchoring it to the crown -->
    <path d="M 26.5 13 Q 32 16 37.5 13"
          fill="none" stroke="#f5b840" stroke-width="1.8"
          stroke-linecap="round" opacity="0.7"/>

    <!-- CROWN: pinched campaign hat, drawn as one solid silhouette. -->
    <path d="M 19 44
             L 19 28
             Q 19 19.5 24 18
             Q 28.5 17 30 19.5
             Q 32 17 34 19.5
             Q 35.5 17 40 18
             Q 45 19.5 45 28
             L 45 44 Z"
          fill="#f5b840"/>

    <!-- CROWN DENT: subtle pinch detail across the top (large sizes only) -->
    <path d="M 24 22 Q 32 25 40 22"
          fill="none" stroke="#0B0D10" stroke-width="1.4"
          stroke-linecap="round" opacity="0.32"/>

    <!-- HAT BAND: dark stripe across the base of the crown -->
    <rect x="19" y="38" width="26" height="3.6" fill="#0B0D10" opacity="0.92"/>
    <!-- Band buckle dot -->
    <circle cx="41" cy="39.8" r="1" fill="#f5b840" opacity="0.95"/>

    <!-- BRIM: wide flat campaign-hat brim, gentle gull-wing curve -->
    <path d="M 3 46
             Q 17 42 32 43
             Q 47 42 61 46
             L 61 50
             Q 47 47 32 48
             Q 17 47 3 50 Z"
          fill="#f5b840"/>
  
    <text x="80" y="42"
      font-family="Inter, system-ui, sans-serif"
      font-weight="800"
      font-size="30"
      letter-spacing="-0.02em"
      fill="#F2F4F7">SmokySignal</text>
  </svg>
